[build]
  command = "yarn build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Funzioni server (assistente). Cartella relativa alla cartella dell'app (frontend).
[functions]
  directory = "netlify/functions"

# Nelle anteprime l'assistente è visibile; in produzione si accende
# aggiungendo EXPO_PUBLIC_ASSISTENTE = "si" a [build.environment].
[context.deploy-preview.environment]
  EXPO_PUBLIC_ASSISTENTE = "si"

# Multi-Comune: i link dedicati (/erba, /sarzana, /vigne-e-vini ...) e tutte
# le pagine interne vengono servite dall'app, che riconosce il Comune dal link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
