[build]
  # Prima del build si controllano i dati: se c'è un errore strutturale il build si ferma
  # e il sito resta sull'ultima versione buona. Vedi CHATGPT_WORKFLOW.md.
  command = "node scripts/controlla-dati.js --bloccante && yarn build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Multi-Comune: i link dedicati (/erba, /sarzana, /vigne-e-vini ...) e tutte
# le pagine interne vengono servite dall'app, che riconosce il Comune dal link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
