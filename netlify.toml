# Configurazione Netlify per la demo di TutelApp (l'app è nella cartella frontend).
# Se nelle impostazioni di Netlify imposti "Base directory = frontend",
# viene usato frontend/netlify.toml, con lo stesso contenuto.
[build]
  base = "frontend"
  # Prima del build si controllano i dati (bonus, Comuni, destinatari, associazioni): se c'è un errore
  # strutturale il build si ferma e il sito resta sull'ultima versione buona. Vedi CHATGPT_WORKFLOW.md.
  command = "node scripts/controlla-dati.js --bloccante && yarn build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
